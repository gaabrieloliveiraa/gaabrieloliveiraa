name: Atualizar estatisticas

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar estatisticas.svg
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python3 scripts/gerar_stats.py
      - name: Commitar se mudou
        run: |
          if ! git diff --quiet estatisticas.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add estatisticas.svg
            git commit -m "chore(stats): atualiza numeros do card de estatisticas"
            git push
          fi
